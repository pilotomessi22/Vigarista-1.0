    <!-- Automatic domain redirect for shared links -->
    <script>
      (function() {
        try {
          var host = window.location.hostname;
          if (host.indexOf('ais-pre-') !== -1 && host.indexOf('run.app') !== -1) {
            var target = 'https://vigarista.tech' + window.location.pathname + window.location.search + window.location.hash;
            window.location.replace(target);
          }
        } catch (e) {}
      })();
    </script>

    <script>
      (function() {
        try {
          var isStandalone = (window.navigator.standalone === true) || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
          if (isStandalone) {
            document.documentElement.classList.add('is-standalone');
          }
          var isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          if (isIos) {
            document.documentElement.classList.add('is-ios');
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function() {});
          }
        } catch (e) {}
      })();
    </script>
